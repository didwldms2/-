<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CCTV 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.0.0/dist/hls.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    /* 기본 스타일 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      overflow: hidden;
      perspective: 1500px; /* 3D 효과의 깊이를 설정 */
    }

    .login-container {
      width: 320px;
      padding: 30px;
      background-color: white;
      border: 8px solid #FF9800;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      transform-style: preserve-3d;
      animation: rotate 5s infinite alternate; /* 회전 애니메이션 */
    }

    /* 로그인 박스 애니메이션 */
    @keyframes rotate {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #FF9800;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .login-container button:hover {
      background-color: #e68900;
    }

  </style>
</head>
<body>

<!-- 로그인 페이지 -->
<div class="login-container" id="login-container">
  <h2>로그인</h2>
  <input type="text" id="username" placeholder="아이디">
  <input type="password" id="password" placeholder="비밀번호">
  <button onclick="login()">로그인</button>
</div>

<!-- CCTV 대시보드 -->
<div class="dashboard-container" id="dashboard-container" style="display: none;">
  <div class="logo">BILT VISION</div>
  <div class="video-container">
    <div class="video-item">
      <h3>CCTV 1</h3>
      <video id="cctv-video-1" controls>
        <source src="http://your-server-url/output1.m3u8" type="application/x-mpegURL">
        <p>비디오를 재생할 수 없습니다.</p>
      </video>
      <button class="record-btn" onclick="toggleRecording('cctv-video-1')">녹화 시작</button>
    </div>
  </div>
</div>

<script>
  // 로그인 기능
  function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (username === "" || password === "") {
      alert('아이디와 비밀번호를 모두 입력해주세요.');
      return;
    }

    if (username === 'admin' && password === '1234') {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('dashboard-container').style.display = 'flex';
    } else {
      alert('아이디 또는 비밀번호가 틀렸습니다.');
    }
  }

  // 녹화 버튼 기능
  function toggleRecording(videoId) {
    const videoElement = document.getElementById(videoId);
    const button = videoElement.nextElementSibling;

    if (button.textContent === "녹화 시작") {
      button.textContent = "녹화 중지";
      console.log(`녹화 시작: ${videoId}`);
    } else {
      button.textContent = "녹화 시작";
      console.log(`녹화 중지: ${videoId}`);
    }
  }

  // HLS.js 로드 및 연결
  if (Hls.isSupported()) {
    var video = document.getElementById('cctv-video-1');
    var hls = new Hls();
    hls.loadSource('http://your-server-url/output1.m3u8'); // 실제 m3u8 URL
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = 'http://your-server-url/output1.m3u8'; // 실제 m3u8 URL
  }
</script>

</body>
</html>
